name: Copse review

# Runs the OSS reviewer on this repository's GitHub-hosted runners. The source
# and reusable workflow are pinned together; no Copse service is involved.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    uses: copse-dev/agent-pane/.github/workflows/reviewer.yml@6bf52b8f196cce90295e6d8c74213e81db825bf5
    with:
      reviewer-ref: 6bf52b8f196cce90295e6d8c74213e81db825bf5
      pr: ${{ inputs.pr }}
      post-summary: true
    secrets:
      model-api-key: ${{ secrets.COPSE_REVIEW_OPENROUTER_API_KEY }}
      app-id: ${{ secrets.RELEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
