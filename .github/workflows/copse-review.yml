name: Copse review

# Runs the OSS reviewer on this repository's GitHub-hosted runners. The source
# and reusable workflow are pinned together; no Copse service is involved.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    uses: copse-dev/agent-pane/.github/workflows/reviewer.yml@d69b518fc0a28c23a6f28b8d7329bd961b44f1dc
    with:
      reviewer-ref: d69b518fc0a28c23a6f28b8d7329bd961b44f1dc
      pr: ${{ inputs.pr }}
      post-summary: true
    secrets:
      model-api-key: ${{ secrets.COPSE_REVIEW_OPENROUTER_API_KEY }}
      app-id: ${{ secrets.RELEASE_APP_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
